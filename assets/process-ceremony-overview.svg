<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="860" viewBox="0 0 1900 860" role="img" aria-labelledby="title desc">
  <title id="title">SBC Scholarship and Business-Startup Program (S&amp;BSP) - Process Overview</title>
  <desc id="desc">PATH A happy path across the top. Decline exits underneath with orange accent: PATH B Sponsor Declines after Sponsor Meetings, PATH C Board Declines after Present to Board, PATH D Elders Decline after Reviews with Elders.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#f59e0b"/>
    </marker>
    <filter id="card" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1900" height="860" fill="#f8fafc"/>

  <!-- Header -->
  <text x="48" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">SBC SCHOLARSHIP AND BUSINESS-STARTUP PROGRAM (S&amp;BSP)</text>
  <text x="48" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Process Overview</text>

  <rect x="48" y="112" width="500" height="36" rx="18" fill="#f1f5f9"/>
  <circle cx="74" cy="130" r="5" fill="#0f172a"/>
  <text x="90" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">After announcements  ·  Recruitment underway</text>

  <!-- PATH A label -->
  <text x="48" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" letter-spacing="1.5">PATH A — HAPPY PATH</text>

  <!-- Step 1 Applications -->
  <g filter="url(#card)">
    <rect x="48" y="220" width="220" height="160" rx="14" fill="#ffffff"/>
  </g>
  <rect x="48" y="220" width="5" height="160" rx="2.5" fill="#10b981"/>
  <circle cx="80" cy="260" r="15" fill="#0f172a"/>
  <text x="80" y="265" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="106" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="106" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Applications</text>
  <text x="72" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Submit via Typeform</text>

  <line x1="268" y1="300" x2="300" y2="300" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 Sponsor Meetings -->
  <g filter="url(#card)">
    <rect x="308" y="200" width="250" height="200" rx="14" fill="#ffffff"/>
  </g>
  <rect x="308" y="200" width="5" height="200" rx="2.5" fill="#10b981"/>
  <circle cx="340" cy="240" r="15" fill="#0f172a"/>
  <text x="340" y="245" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="366" y="235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="366" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Sponsor Meetings</text>
  <text x="332" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Assign · Meet · Plan</text>
  <text x="332" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Docs ready to present</text>
  <text x="332" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">to the board</text>

  <!-- Fork after step 2: continue PATH A + drop to PATH B -->
  <line x1="558" y1="300" x2="590" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="590" y1="300" x2="622" y2="300" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="300" x2="590" y2="520" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>

  <!-- Step 3 Present to Board -->
  <g filter="url(#card)">
    <rect x="630" y="220" width="230" height="160" rx="14" fill="#ffffff"/>
  </g>
  <rect x="630" y="220" width="5" height="160" rx="2.5" fill="#10b981"/>
  <circle cx="662" cy="260" r="15" fill="#0f172a"/>
  <text x="662" y="265" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="688" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="688" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Present to Board</text>
  <text x="654" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Sponsor presents plan</text>

  <!-- Fork after step 3: continue PATH A + drop to PATH C -->
  <line x1="860" y1="300" x2="892" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="892" y1="300" x2="924" y2="300" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="892" y1="300" x2="892" y2="520" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>

  <!-- Step 4 Reviews with Elders -->
  <g filter="url(#card)">
    <rect x="932" y="220" width="250" height="160" rx="14" fill="#ffffff"/>
  </g>
  <rect x="932" y="220" width="5" height="160" rx="2.5" fill="#10b981"/>
  <circle cx="964" cy="260" r="15" fill="#0f172a"/>
  <text x="964" y="265" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="990" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="990" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Reviews with Elders</text>
  <text x="956" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Elder evaluation</text>

  <!-- Fork after step 4: continue PATH A + drop to PATH D -->
  <line x1="1182" y1="300" x2="1214" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1214" y1="300" x2="1246" y2="300" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1214" y1="300" x2="1214" y2="520" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>

  <!-- Approved (end of Path A) -->
  <g filter="url(#card)">
    <rect x="1254" y="200" width="580" height="200" rx="14" fill="#ffffff"/>
  </g>
  <rect x="1254" y="200" width="5" height="200" rx="2.5" fill="#10b981"/>
  <text x="1282" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669" letter-spacing="1.2">PATH A · APPROVED</text>
  <text x="1282" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Award Money</text>
  <text x="1282" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Assign Sponsor / Board cadence</text>
  <text x="1282" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">of review meetings</text>

  <!-- Decline row label -->
  <text x="48" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" letter-spacing="1.5">DECLINE PATHS (UNDER PATH A)</text>

  <!-- PATH B under step 2 (centered on fork x=590) -->
  <g filter="url(#card)">
    <rect x="440" y="540" width="300" height="120" rx="14" fill="#ffffff"/>
  </g>
  <rect x="440" y="540" width="5" height="120" rx="2.5" fill="#f59e0b"/>
  <text x="468" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d97706" letter-spacing="1.2">PATH B</text>
  <text x="468" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Sponsor Declines with Notes</text>

  <!-- PATH C under step 3 (centered on fork x=892) -->
  <g filter="url(#card)">
    <rect x="742" y="540" width="300" height="120" rx="14" fill="#ffffff"/>
  </g>
  <rect x="742" y="540" width="5" height="120" rx="2.5" fill="#f59e0b"/>
  <text x="770" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d97706" letter-spacing="1.2">PATH C</text>
  <text x="770" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Board Declines with Notes</text>

  <!-- PATH D under step 4 (centered on fork x=1214) -->
  <g filter="url(#card)">
    <rect x="1064" y="540" width="300" height="120" rx="14" fill="#ffffff"/>
  </g>
  <rect x="1064" y="540" width="5" height="120" rx="2.5" fill="#f59e0b"/>
  <text x="1092" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d97706" letter-spacing="1.2">PATH D</text>
  <text x="1092" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Elders Decline with Notes</text>

  <!-- Legend -->
  <rect x="48" y="720" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="68" y="731" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Path A (happy path)</text>
  <rect x="220" y="720" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="240" y="731" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Paths B–D (decline)</text>

  <text x="48" y="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Strasburg Baptist Church  ·  Planning team  ·  Working draft</text>
</svg>
