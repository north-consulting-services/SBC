<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">SBC Scholarship and Business-Startup Program (S&amp;BSP) - Process Overview</title>
  <desc id="desc">Linear spine: Applications, Sponsor Meetings, Present to Board, Reviews with Elders, then Approved. Path A board decline forks up after Present; Path C Elders decline forks down after Elders.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#94a3b8"/>
    </marker>
    <filter id="card" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1800" height="820" fill="#f8fafc"/>

  <!-- Header -->
  <text x="56" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">SBC SCHOLARSHIP AND BUSINESS-STARTUP PROGRAM (S&amp;BSP)</text>
  <text x="56" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Process Overview</text>

  <rect x="56" y="116" width="500" height="36" rx="18" fill="#f1f5f9"/>
  <circle cx="82" cy="134" r="5" fill="#0f172a"/>
  <text x="98" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">After announcements  ·  Recruitment underway</text>

  <!-- Center spine y = 400 for step card centers; card height 160 → top 320 -->
  <!-- Step 1 -->
  <g filter="url(#card)">
    <rect x="56" y="320" width="220" height="160" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="88" cy="360" r="15" fill="#0f172a"/>
  <text x="88" y="365" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="114" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="114" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Applications</text>
  <text x="80" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Submit via Typeform</text>

  <line x1="276" y1="400" x2="308" y2="400" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#card)">
    <rect x="316" y="300" width="250" height="200" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="348" cy="340" r="15" fill="#0f172a"/>
  <text x="348" y="345" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="374" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="374" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Sponsor Meetings</text>
  <text x="340" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Assign · Meet · Plan</text>
  <text x="340" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Docs ready to present</text>
  <text x="340" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">to the board</text>

  <line x1="566" y1="400" x2="598" y2="400" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#card)">
    <rect x="606" y="320" width="220" height="160" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="638" cy="360" r="15" fill="#0f172a"/>
  <text x="638" y="365" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="664" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="664" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Present to Board</text>
  <text x="630" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Sponsor presents plan</text>

  <!-- Spine continues to Elders; Path A forks up -->
  <line x1="826" y1="400" x2="860" y2="400" stroke="#cbd5e1" stroke-width="2"/>
  <!-- vertical up to Path A -->
  <line x1="860" y1="400" x2="860" y2="220" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="860" y1="220" x2="900" y2="220" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- continue right to Step 4 -->
  <line x1="860" y1="400" x2="900" y2="400" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PATH A (above spine) -->
  <g filter="url(#card)">
    <rect x="908" y="160" width="320" height="120" rx="14" fill="#ffffff"/>
  </g>
  <rect x="908" y="160" width="5" height="120" rx="2.5" fill="#f59e0b"/>
  <text x="936" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d97706" letter-spacing="1.2">PATH A</text>
  <text x="936" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Board Declines with Notes</text>

  <!-- Step 4 Elders on spine -->
  <g filter="url(#card)">
    <rect x="908" y="320" width="250" height="160" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="940" cy="360" r="15" fill="#0f172a"/>
  <text x="940" y="365" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="966" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">STEP</text>
  <text x="966" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Reviews with Elders</text>
  <text x="932" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Elder evaluation</text>

  <!-- Spine continues to Path B; Path C forks down -->
  <line x1="1158" y1="400" x2="1192" y2="400" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1192" y1="400" x2="1192" y2="600" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1192" y1="600" x2="1232" y2="600" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1192" y1="400" x2="1232" y2="400" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PATH B (on spine, forward) -->
  <g filter="url(#card)">
    <rect x="1240" y="320" width="500" height="160" rx="14" fill="#ffffff"/>
  </g>
  <rect x="1240" y="320" width="5" height="160" rx="2.5" fill="#10b981"/>
  <text x="1268" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669" letter-spacing="1.2">PATH B</text>
  <text x="1268" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Approved / Award Money</text>
  <text x="1268" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Assign Sponsor / Board cadence of review meetings</text>

  <!-- PATH C (below spine) -->
  <g filter="url(#card)">
    <rect x="1240" y="540" width="500" height="120" rx="14" fill="#ffffff"/>
  </g>
  <rect x="1240" y="540" width="5" height="120" rx="2.5" fill="#f59e0b"/>
  <text x="1268" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d97706" letter-spacing="1.2">PATH C</text>
  <text x="1268" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Elders Decline with Notes</text>

  <!-- Legend -->
  <rect x="56" y="700" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="76" y="711" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Decline</text>
  <rect x="148" y="700" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="168" y="711" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Approve</text>

  <text x="56" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Strasburg Baptist Church  ·  Planning team  ·  Working draft</text>
</svg>
